stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  script:
    - V="${CI_COMMIT_TAG#v}"
    - if [[ "$V" == *-dev ]]; then DEV_SUFFIX="-dev"; V="${V%-dev}"; else DEV_SUFFIX=""; fi
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
    - echo "DEV_SUFFIX=${DEV_SUFFIX}" >> tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  GOPRIVATE: "gitlab.com/secondstarcavalier/*"
  GONOSUMCHECK: "gitlab.com/secondstarcavalier/*"
  CGO_ENABLED: "0"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    if [[ "$V" == *-dev ]]; then DEV_SUFFIX="-dev"; V="${V%-dev}"; else DEV_SUFFIX=""; fi
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  cache:
    key: go-modules
    paths:
      - .go-cache
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.go-cache/mod"
    GOCACHE: "$CI_PROJECT_DIR/.go-cache/build"
  before_script:
    - *setup-netrc
    - tacplus build --skip-post
  script:
    - go build -trimpath -ldflags="-s -w" -o bin/letsencrypt .
  artifacts:
    paths:
      - bin/letsencrypt
    expire_in: 1 hour

build-amd64:
  extends: .build-arch

build-arm64:
  extends: .build-arch
  tags:
    - saas-linux-large-arm64

.package-arch:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/letsencrypt-${MAJOR}-${MINOR}"
      docker build -t "${IMAGE}:${PATCH}${DEV_SUFFIX}-${ARCH}" .
      docker push "${IMAGE}:${PATCH}${DEV_SUFFIX}-${ARCH}"

package-amd64:
  extends: .package-arch
  needs: [build-amd64]
  variables:
    ARCH: amd64

package-arm64:
  extends: .package-arch
  needs: [build-arm64]
  tags:
    - saas-linux-large-arm64
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  image: docker:latest
  services:
    - docker:dind
  needs: [package-amd64, package-arm64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/letsencrypt-${MAJOR}-${MINOR}"
      docker manifest create "${IMAGE}:${PATCH}${DEV_SUFFIX}" "${IMAGE}:${PATCH}${DEV_SUFFIX}-amd64" "${IMAGE}:${PATCH}${DEV_SUFFIX}-arm64"
      docker manifest push "${IMAGE}:${PATCH}${DEV_SUFFIX}"
      docker manifest create "${IMAGE}:latest${DEV_SUFFIX}" "${IMAGE}:${PATCH}${DEV_SUFFIX}-amd64" "${IMAGE}:${PATCH}${DEV_SUFFIX}-arm64"
      docker manifest push "${IMAGE}:latest${DEV_SUFFIX}"
      docker manifest create "${IMAGE}:v${MAJOR}.${MINOR}.${PATCH}${DEV_SUFFIX}" "${IMAGE}:${PATCH}${DEV_SUFFIX}-amd64" "${IMAGE}:${PATCH}${DEV_SUFFIX}-arm64"
      docker manifest push "${IMAGE}:v${MAJOR}.${MINOR}.${PATCH}${DEV_SUFFIX}"

# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - V="${PROTO_VERSION#v}"
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
