stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  script:
    - apk add --no-cache curl jq
    - |
      # Read pinned tacplus version from tacplus.yaml (required).
      # Format: "MAJOR.MINOR.PATCH" where PATCH is a number or "x" (resolve latest).
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      PATCH="$(echo "$TACPLUS_VER" | cut -d. -f3)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      if [ "$PATCH" = "x" ]; then
        # Use CI job token (allowlisted on schematic/tacplus) to query container registry via GitLab API.
        TACPLUS_PROJECT_ID="81965435"
        REPO_ID=$(curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.com/api/v4/projects/${TACPLUS_PROJECT_ID}/registry/repositories" \
          | jq -r ".[] | select(.path | endswith(\"tacplus-${MAJOR}-${MINOR}\")) | .id")
        PATCH=$(curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.com/api/v4/projects/${TACPLUS_PROJECT_ID}/registry/repositories/${REPO_ID}/tags?per_page=100" \
          | jq -r '.[].name' | grep -xE '[0-9]+' | sort -n | tail -1)
        if [ -z "$PATCH" ]; then
          echo "ERROR: no patch tags found for tacplus ${MAJOR}.${MINOR} in registry" >&2; exit 1
        fi
        echo "Resolved tacplus ${MAJOR}.${MINOR}.x -> ${MAJOR}.${MINOR}.${PATCH}"
      fi
      IMAGE="${CI_REGISTRY}/${REPO}:${PATCH}"
      echo "TACPLUS_IMAGE=${IMAGE}" > tacplus.env
      echo "Using tacplus image: ${IMAGE}"
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  DOCKER_TLS_CERTDIR: ""
  GOPRIVATE: "gitlab.com/secondstarcavalier/*"
  GONOSUMCHECK: "gitlab.com/secondstarcavalier/*"
  CGO_ENABLED: "0"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    MINOR="$(echo "$DOTPART" | cut -d. -f2)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  cache:
    key: go-modules
    paths:
      - .go-cache
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.go-cache/mod"
    GOCACHE: "$CI_PROJECT_DIR/.go-cache/build"
  before_script:
    - *setup-netrc
    - tacplus build --skip-post
  script:
    - go build -trimpath -ldflags="-s -w" -o bin/letsencrypt .
  artifacts:
    paths:
      - bin/letsencrypt
    expire_in: 1 hour

build-arm64:
  extends: .build-arch
  tags:
    - schematic-aarch64

.package-arch:
  stage: package
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    # Pre-pull the schematic base image while DOCKER_AUTH_CONFIG (group read) is active,
    # then switch to the CI job token for push.
    - docker pull "$(awk '/^FROM/{print $2; exit}' Dockerfile)" || true
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/letsencrypt-${MAJOR}-${MINOR}"
      docker build --platform "linux/${ARCH}" \
        -t "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        .
      docker push "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}"

package-arm64:
  extends: .package-arch
  tags:
    - schematic-aarch64
  needs: [build-arm64]
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  tags:
    - schematic-aarch64
  needs: [package-arm64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/letsencrypt-${MAJOR}-${MINOR}"
      docker pull --platform linux/arm64 "${IMAGE}:${CI_COMMIT_TAG}-arm64"
      docker tag "${IMAGE}:${CI_COMMIT_TAG}-arm64" "${IMAGE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE}:${CI_COMMIT_TAG}"
# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - apk add --no-cache curl jq
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      PATCH="$(echo "$TACPLUS_VER" | cut -d. -f3)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      if [ "$PATCH" = "x" ]; then
        TACPLUS_PROJECT_ID="81965435"
        REPO_ID=$(curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.com/api/v4/projects/${TACPLUS_PROJECT_ID}/registry/repositories" \
          | jq -r ".[] | select(.path | endswith(\"tacplus-${MAJOR}-${MINOR}\")) | .id")
        PATCH=$(curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.com/api/v4/projects/${TACPLUS_PROJECT_ID}/registry/repositories/${REPO_ID}/tags?per_page=100" \
          | jq -r '.[].name' | grep -xE '[0-9]+' | sort -n | tail -1)
        if [ -z "$PATCH" ]; then
          echo "ERROR: no patch tags found for tacplus ${MAJOR}.${MINOR} in registry" >&2; exit 1
        fi
      fi
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/${REPO}:${PATCH}" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
