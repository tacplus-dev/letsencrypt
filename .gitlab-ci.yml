stages:
  - build
  - package

variables:
  GOPRIVATE: "gitlab.com/secondstarcavalier/*"
  GONOSUMCHECK: "gitlab.com/secondstarcavalier/*"
  CGO_ENABLED: "0"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

build:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache git
    - *setup-netrc
  script:
    - |
      for target in linux/amd64 linux/arm64; do
        GOOS="${target%/*}"
        GOARCH="${target#*/}"
        echo "Building letsencrypt for ${GOOS}/${GOARCH}..."
        GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "bin/letsencrypt-${GOARCH}" .
      done
  artifacts:
    paths:
      - bin/letsencrypt-*
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name multiarch --driver docker-container
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/letsencrypt-${MAJOR}-${MINOR}"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "${IMAGE}:${PATCH}" \
        -t "${IMAGE}:latest" \
        --push .
