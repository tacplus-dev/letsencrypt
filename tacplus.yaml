# The compiler line this repository builds with: the looper runs that line's
# latest patch (tacplus-dev/tacplus#161).
tacplus: "2.4"
language: go
# pkg kept as copied so the hand-written code keeps compiling; moves with the packages later.
pkg: com.gitlab.seabeam.schematic.platform.services.letsencrypt
output-dir: model
src: proto
# records here declare residency; the record query plane that reads them is the
# query trait hosted by stratum, so stratum's contract is part of this build.
depends:
  # letsencrypt.proto imports kernel.Identity state.
  - kernel
  # topics declared here publish through the eventbus broker.
  - eventbus
  - stratum
header: |
